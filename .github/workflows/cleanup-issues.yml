name: Cleanup CI issues

on:
  workflow_dispatch:
  push:
    paths: [ '.github/workflows/cleanup-issues.yml' ]

jobs:
  close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close CI failure issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'CI failure log in:title' --json number -q '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason "not planned" || true
          done
